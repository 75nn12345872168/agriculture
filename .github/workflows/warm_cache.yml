name: Warm Render Cache & Update Snapshot (GSCSI 2026)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warm-render-cache
  cancel-in-progress: false

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wake up Render server (/health)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://agriculture-qpvc.onrender.com/health"
          DEADLINE=$((SECONDS + 90))
          ATTEMPT=0

          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "[Attempt $ATTEMPT | ${SECONDS}s] GET $URL -> HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is awake: $(cat /tmp/health.json)"
              exit 0
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -le 0 ]; then
              break
            fi
            sleep $(( REMAINING < 5 ? REMAINING : 5 ))
          done

          echo "::error::Render server did not return HTTP 200 within 90 seconds."
          exit 1

      - name: Warm GSCSI 2026 cache & save static snapshot
        shell: bash
        run: |
          set -euo pipefail
          URL="https://agriculture-qpvc.onrender.com/api/gscsi?year=2026&start_month=6&end_month=10"
          ORIGIN="https://75nn12345872168.github.io"
          MAX_ATTEMPTS=3
          HTTP_CODE="000"

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            RESULT=$(curl -sS -o /tmp/gscsi_2026.json \
              -w "http_code=%{http_code} time_total=%{time_total}s size_download=%{size_download}B" \
              --max-time 150 \
              -H "Origin: $ORIGIN" \
              "$URL" || echo "http_code=000 time_total=0s size_download=0B")

            echo "[Attempt $ATTEMPT/$MAX_ATTEMPTS] Warm cache result: $RESULT"
            HTTP_CODE=$(echo "$RESULT" | sed -n 's/.*http_code=\([0-9]*\).*/\1/p')

            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Transient status HTTP $HTTP_CODE (possible cold start); retrying in 10s..."
              sleep 10
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cache warming failed with HTTP $HTTP_CODE after $MAX_ATTEMPTS attempts"
            head -c 500 /tmp/gscsi_2026.json || true
            exit 1
          fi

          mkdir -p data
          python3 - <<'EOF'
          import json
          import pathlib

          with open("/tmp/gscsi_2026.json", encoding="utf-8") as f:
              data = json.load(f)

          required_keys = ("meta", "summary", "map", "localities", "ndvi_timeseries", "phenology")
          missing = [k for k in required_keys if k not in data]
          if missing:
              raise ValueError(f"Incomplete GSCSI payload; missing keys: {missing}")

          # حذف request_id المتغير في كل طلب حتى لا يسبب commit بلا تغيير فعلي في البيانات
          data.pop("request_id", None)

          out_path = pathlib.Path("data/gscsi_2026.json")
          out_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )

          summary = data.get("summary", {})
          meta = data.get("meta", {})
          localities = data.get("localities", [])
          print(
              f"Saved {out_path} | season={meta.get('season_year')} "
              f"gscsi_mean={summary.get('gscsi_mean')} "
              f"label={summary.get('gscsi_class_label')} "
              f"localities={len(localities)} "
              f"generated_at={meta.get('generated_at')}"
          )
          EOF

      - name: Commit & push updated snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/gscsi_2026.json && [ -z "$(git ls-files --others --exclude-standard data/gscsi_2026.json)" ]; then
            echo "Snapshot data/gscsi_2026.json unchanged — skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gscsi_2026.json
          git commit -m "chore(data): update GSCSI 2026 static snapshot"
          git pull --rebase origin main
          git push origin main
